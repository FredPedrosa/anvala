[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "anvala"
version = "0.1.0"
description = "GPU-Accelerated Psychometrics, Structural Equation Modeling, and Network Psychometrics in Python"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Frederico Gonçalves Pedrosa", email = "frederico.musicoterapia@gmail.com"}
]
keywords = [
    "psychometrics",
    "structural-equation-modeling",
    "cfa",
    "sem",
    "network-psychometrics",
    "ega",
    "lavaan",
    "pytorch",
    "cuda",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.0",
    "torch>=2.2",
    "igraph>=0.11",
]

[project.urls]
Homepage = "https://github.com/FredPedrosa/anvala"
Repository = "https://github.com/FredPedrosa/anvala"
Issues = "https://github.com/FredPedrosa/anvala/issues"

[tool.setuptools.packages.find]
where = ["src"]