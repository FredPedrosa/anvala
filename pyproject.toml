[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "anvala"
version = "0.1.0"
description = "Análise de Variáveis Latentes, Índices Bifatoriais e SEM Multinível Ordinal em Python"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.0",
    "torch>=2.2",
]

[tool.setuptools.packages.find]
where = ["src"]